services:
  robis_sim:
    build:
      context: .
      dockerfile: Dockerfile.sim
    image: robis_sim:latest
    container_name: robis_sim

    # ------------------------------------------------------------------
    # GUI (RViz / Gazebo) via X11 do host
    # ------------------------------------------------------------------
    # Pré-requisito no HOST (rode uma vez por sessão, fora do container):
    #   xhost +local:docker
    environment:
      - DISPLAY=localhost:11
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.xauth_docker
      - ROS_DOMAIN_ID=27
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.Xauthority}:/tmp/.xauth_docker:ro
      - ./src/:/root/ros2_ws/src/
    network_mode: host
    devices:
      - /dev/:/dev/
    privileged: true

    # ------------------------------------------------------------------
    # GPU (opcional, mas recomendado para Gazebo)
    # ------------------------------------------------------------------
    # Requer nvidia-container-toolkit instalado no host. Se você não tem
    # GPU NVIDIA dedicada, comente o bloco "deploy" inteiro — o Gazebo
    # ainda funciona, só mais lento.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    stdin_open: true
    tty: true
