environment: semantic_hall
world: semantic_hall.world
ground_truth: ground_truth_semantic_hall.yaml
detector_backend: oracle
detector_device: cpu
enable_reference_oracle: true
enable_detector_evaluator: true
expected_classes: [chair, couch, dining table, bed, toilet]
launch_mode: perception
rotation_backend: cmd_vel
localization_frame: odom

# Confirmatory geometry campaign. Poses were selected by cardinal viewpoint and
# nonzero observability in the separate screen; screen samples are excluded.
trials:
  - {id: table_confirm_west_r01, x: 3.5, y: -4.12, yaw: 0.0, estimators: [bbox_cluster, mask_projected_cluster]}
  - {id: table_confirm_north_r01, x: 4.82, y: -2.8, yaw: -1.5708, estimators: [bbox_cluster, mask_projected_cluster]}
  - {id: table_confirm_east_r01, x: 7.5, y: -4.88, yaw: 3.14159, estimators: [bbox_cluster, mask_projected_cluster]}

  - {id: table_confirm_east_r02, x: 7.5, y: -4.88, yaw: 3.14159, estimators: [mask_projected_cluster, bbox_cluster]}
  - {id: table_confirm_west_r02, x: 3.5, y: -4.12, yaw: 0.0, estimators: [mask_projected_cluster, bbox_cluster]}
  - {id: table_confirm_north_r02, x: 4.82, y: -2.8, yaw: -1.5708, estimators: [mask_projected_cluster, bbox_cluster]}

  - {id: table_confirm_north_r03, x: 4.82, y: -2.8, yaw: -1.5708, estimators: [bbox_cluster, mask_projected_cluster]}
  - {id: table_confirm_east_r03, x: 7.5, y: -4.88, yaw: 3.14159, estimators: [bbox_cluster, mask_projected_cluster]}
  - {id: table_confirm_west_r03, x: 3.5, y: -4.12, yaw: 0.0, estimators: [bbox_cluster, mask_projected_cluster]}

  - {id: table_confirm_west_r04, x: 3.5, y: -4.12, yaw: 0.0, estimators: [mask_projected_cluster, bbox_cluster]}
  - {id: table_confirm_east_r04, x: 7.5, y: -4.88, yaw: 3.14159, estimators: [mask_projected_cluster, bbox_cluster]}
  - {id: table_confirm_north_r04, x: 4.82, y: -2.8, yaw: -1.5708, estimators: [mask_projected_cluster, bbox_cluster]}

  - {id: table_confirm_north_r05, x: 4.82, y: -2.8, yaw: -1.5708, estimators: [bbox_cluster, mask_projected_cluster]}
  - {id: table_confirm_west_r05, x: 3.5, y: -4.12, yaw: 0.0, estimators: [bbox_cluster, mask_projected_cluster]}
  - {id: table_confirm_east_r05, x: 7.5, y: -4.88, yaw: 3.14159, estimators: [bbox_cluster, mask_projected_cluster]}
