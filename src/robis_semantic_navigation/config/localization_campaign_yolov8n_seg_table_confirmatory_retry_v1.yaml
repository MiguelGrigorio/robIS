environment: semantic_hall
world: semantic_hall.world
ground_truth: ground_truth_semantic_hall.yaml
detector_backend: yolo26
detector_device: cpu
detector_model: /robis_ws/data/models/semantic_hall_yolov8n_seg_v1/best.pt
enable_reference_oracle: true
enable_detector_evaluator: true
expected_classes: [chair, couch, dining table, bed, toilet]
launch_mode: perception
rotation_backend: cmd_vel
localization_frame: odom

# Continuation after the first launch of east_r04 received no CameraInfo and
# was rejected before ablation. No samples from that invalid launch are pooled.
trials:
  - {id: learned_table_east_r04, x: 7.5, y: -4.88, yaw: 3.14159, estimators: [mask_projected_cluster, bbox_cluster]}
  - {id: learned_table_north_r04, x: 4.82, y: -2.8, yaw: -1.5708, estimators: [mask_projected_cluster, bbox_cluster]}
  - {id: learned_table_north_r05, x: 4.82, y: -2.8, yaw: -1.5708, estimators: [bbox_cluster, mask_projected_cluster]}
  - {id: learned_table_west_r05, x: 3.5, y: -4.12, yaw: 0.0, estimators: [bbox_cluster, mask_projected_cluster]}
  - {id: learned_table_east_r05, x: 7.5, y: -4.88, yaw: 3.14159, estimators: [bbox_cluster, mask_projected_cluster]}
