# ============================================================================
# ROBIS — Parâmetros do robô
# ============================================================================
# Único arquivo que normalmente precisa ser editado para ajustar medidas
# físicas, nomes de frames (TF) e configuração dos sensores simulados.
# O urdf/robis.urdf.xacro carrega estes valores via xacro.load_yaml().
#
# Todas as distâncias em METROS, massas em QUILOGRAMAS.
# ============================================================================

physical:
  # ---- Chassi ----
  # chassis_radius é a aproximação por CILINDRO da colisão física (o visual
  # usa o mesh real, não circular). 0.242 foi escolhido por ser o raio que
  # melhor aproxima a ÁREA real do chassi (octógono/escudo), calculado a
  # partir das dimensões do mesh (chassis.stl): erro de apenas ~1%.
  chassis_radius: 0.242
  chassis_height: 0.16
  chassis_mass: 5.0
  ground_clearance: 0.065       # folga da base do chassi (base_link) até o chão

  # ---- Rodas motrizes (esquerda / direita) ----
  wheel_radius: 0.0854
  wheel_width: 0.04
  wheel_track: 0.36             # distância entre o centro das duas rodas
  wheel_mass: 0.5

  # ---- Rodas caster (livres, frente e trás) ----
  # Ficam perto da ponta do chassi (offset calculado a partir da extensão
  # real do mesh em X, com ~2cm de folga da borda extrema). O robô "bambeia"
  # levemente sobre o eixo das rodas motrizes: os casters tocam o chão
  # caster_ground_gap acima do chão quando o chassi está horizontal.
  # O modelo existente concentra mais massa no apoio traseiro. Os valores
  # foram mantidos como aproximações; a distribuição real precisa de medição.
  caster_radius: 0.025          # ~2 polegadas de diâmetro
  caster_offset_x: 0.18
  caster_ground_gap: 0.005
  caster_front_mass: 0.05
  caster_rear_mass: 0.75
  # Geometria aproximada: pivô vertical, garfo e roda com eixo horizontal.
  # A massa existente é repartida entre suporte e roda, sem mudar o total.
  caster_width: 0.015
  caster_trail: 0.015           # eixo da roda atrás do pivô; permite autoalinhamento
  caster_mount_mass_fraction: 0.25
  caster_swivel_damping: 0.001
  caster_rolling_damping: 0.00005
  caster_bearing_friction: 0.00001
  caster_contact_friction: 0.8

  # ---- Torre do LIDAR ----
  lidar_tower_height: 0.05
  lidar_tower_radius: 0.04
  lidar_mass: 0.2

  # ---- Câmera ----
  # Fica perto da borda frontal do chassi, próxima ao topo (mas abaixo da
  # tampa/bumper).
  camera_offset_x: 0.21
  camera_offset_z: 0.12

  # ---- Marcador ArUco ----
  # Apoiado sobre o vidro/janela no TOPO do chassi (não é adesivo lateral).
  # Tamanho batendo com o mesh real modelado (aruco_marker.stl).
  aruco_size_xy: 0.22
  aruco_thickness: 0.001

# ----------------------------------------------------------------------------
# Nomes dos frames (TF). Mudar só com motivo específico — Nav2 e outras
# ferramentas ROS2 esperam nomes como "base_footprint" e "base_link" por
# convenção. Ter isso configurável (em vez de hardcoded no xacro) facilita,
# por exemplo, adicionar um prefixo por robô no futuro (multi-robô).
# ----------------------------------------------------------------------------
frames:
  base_footprint: base_footprint
  base_link: base_link
  lidar_tower: lidar_tower
  lidar_link: lidar_link
  camera_link: camera_link
  camera_optical_frame: camera_optical_frame
  aruco_marker: aruco_marker

# ----------------------------------------------------------------------------
# Sensores simulados (usados apenas quando sim_flavor=gz no xacro). Os
# valores de resolução/framerate da câmera batem propositalmente com o
# pipeline GStreamer real usado no robis_vision (v4l2src, 640x480 @ 30fps),
# para que código de visão testado na simulação se comporte de forma
# parecida ao rodar na câmera USB física depois.
# ----------------------------------------------------------------------------
sensors:
  lidar:
    update_rate: 10.0
    samples: 360
    min_angle: -3.14159
    max_angle: 3.14159
    range_min: 0.10
    range_max: 6.5
    range_resolution: 0.01
    noise_stddev: 0.01

  camera:
    # Optical origin for the updated CAD visual, relative to base_link.
    # Gazebo only; physical camera_offset_* above still require calibration.
    optical_origin_x: 0.245
    optical_origin_z: 0.118
    update_rate: 30.0
    horizontal_fov: 1.222
    width: 640
    height: 480
    near_clip: 0.02
    far_clip: 100.0
    noise_stddev: 0.007
