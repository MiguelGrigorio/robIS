ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Placeholder inicial para a futura fusao do paper.
    # Na simulacao atual, o /demo/odom vindo do Gazebo ja e suficiente.
    odom0: /demo/odom
    odom0_config:
      [
        true, true, false,
        false, false, true,
        true, false, false,
        false, false, true,
        false, false, false
      ]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
